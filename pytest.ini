[pytest]
; 串行执行（本机可用内存约 2.4G，禁止 xdist 并发以免 OOM）
addopts = -q -p no:cacheprovider --tb=short
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
; 阶段 4：事件总线与 SSE 需要异步测试
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
filterwarnings =
    error::DeprecationWarning:mcp.*
